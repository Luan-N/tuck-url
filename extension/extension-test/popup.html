<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tuck URL Shortener</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body class="m-0 p-0 bg-gray-50">
  <div class="w-96 bg-white">
    <div class="px-5 py-4">
      <!-- Header -->
      <div class="mb-4">
        <h1 class="text-xl font-bold text-gray-900"> Tuck URL</h1>
      </div>

      <!-- URL Input -->
      <div class="mb-3">
        <label for="currentUrl" class="block text-sm font-medium text-gray-700 mb-2">
          Current URL
        </label>
        <input
          type="text"
          id="currentUrl"
          class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm font-mono focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
          placeholder="Loading current URL..."
        />
      </div>

      <!-- Expiration Dropdown -->
      <div class="mb-3">
        <label for="expirationSelect" class="block text-sm font-medium text-gray-700 mb-2">
          Expires
        </label>
        <select
          id="expirationSelect"
          class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
        >
          <option value="never">Never</option>
          <option value="1h">1 Hour</option>
          <option value="1d">1 Day</option>
          <option value="1w">1 Week</option>
          <option value="1mo">1 Month</option>
          <option value="1y">1 Year</option>
        </select>
      </div>

      <!-- Custom Short Link Input (Optional) -->
      <div class="mb-3">
        <label for="customCode" class="block text-sm font-medium text-gray-700 mb-2">
          Custom Short Link <span class="text-xs text-gray-500">(optional)</span>
        </label>
        <input
          type="text"
          id="customCode"
          placeholder="e.g., mylink, docs, blog-post"
          class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
        />
      </div>

      <!-- Action Button -->
      <button
  id="shortenBtn"
  class="
    w-full rounded-lg bg-blue-600 px-4 py-2
    text-sm font-medium text-white
    hover:bg-blue-700
    disabled:cursor-not-allowed
    disabled:bg-blue-400
    disabled:opacity-60
  "
>
  Shorten URL
</button>

      <!-- Output Section (Hidden by default) -->
      <p id="statusMessage" class="mb-2 text-sm text-gray-600"></p>
      <div id="outputSection" class="hidden mt-4 pt-4 border-t border-gray-200">
        <label for="shortenedUrl" class="block text-sm font-medium text-gray-700 mb-2">
          Shortened URL
        </label>
        <div class="flex gap-2">
          <input
            type="text"
            id="shortenedUrl"
            readonly
            class="flex-1 px-3 py-2 border border-gray-300 rounded-lg text-sm font-mono bg-gray-50"
          />
          <button
            id="copyBtn"
            class="px-4 py-2 bg-gray-200 text-gray-800 text-sm font-medium rounded-lg hover:bg-gray-300 transition-colors"
          >
            Copy
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
